<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 224" width="600" height="224" role="img" aria-label="Persistence and replication: Every order written down, then consolidated from many servers into one view.">
<style>
    .serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif} .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .t{fill:#1B2330} .m{fill:#5E6875}
    .bid{fill:#0E8F78} .ask{fill:#C93A63} .acc{fill:#A87B00}
    .rule{stroke:#D5DAE1;stroke-width:1}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<line class="rule" x1="8" y1="14" x2="592" y2="14"/>
<rect x="8" y="12" width="72" height="5" fill="#C93A63"/>
<text x="8" y="66" class="serif t" font-size="34">Persistence and replication</text>
<text x="8" y="104" class="sans m" font-size="20">Every order written down, then consolidated from many</text>
<text x="8" y="132" class="sans m" font-size="20">servers into one view.</text>
<text x="8" y="206" class="mono t" font-size="16">MySQL, multi-source replication</text>
</svg>
