<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="600" height="120" role="img" aria-label="Sell 1 lot: hits the bid at 99.95">
<style>
    .serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif} .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .t{fill:#E9E4D8} .m{fill:#8D96A5}
    .bid{fill:#2FBF9F} .ask{fill:#F0668A} .acc{fill:#F4D35E}
    .rule{stroke:#2A313C;stroke-width:1}
    
    .btn{animation:glow 3s ease-in-out infinite}
    @keyframes glow{0%,100%{fill-opacity:.14}50%{fill-opacity:.26}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect class="btn" x="4" y="4" width="592" height="112" rx="10" fill="#F0668A" fill-opacity=".14" stroke="#F0668A" stroke-width="2"/><text x="300" y="58" text-anchor="middle" class="serif" font-size="36" fill="#F0668A">Sell 1 lot</text><text x="300" y="92" text-anchor="middle" class="mono m" font-size="17">hits the bid at 99.95</text>
</svg>
