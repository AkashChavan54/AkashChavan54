<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 304" width="1200" height="304" role="img" aria-label="Order blotter: B.Tech in Computer Science, IIT Kanpur, filled; Quant developer, trading infrastructure, working; C++17 on Linux, with MySQL underneath, working; Markets, and trading them, partly filled; Eight hours of sleep, rejected by risk check">
<style>
